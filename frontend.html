<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Application Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Portal Screen -->
        <div class="portal-container" id="portalSection">
            <div class="portal-content">
                <!-- Header -->
                <div class="header">
                    <div class="header-title">
                        <div class="header-logo">🏢</div>
                        <div>
                            <h1>Application Portal</h1>
                            <div class="user-info">
                                <span id="userTypeIndicator"></span>
                            </div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <a id="adminLink" href="management.html" class="admin-console-btn" style="display: none;">⚙️ Admin Console</a>
                        <a id="loginLink" href="login.html" class="admin-console-btn" style="display: none;">🔑 Login</a>
                        <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">🚪 Logout</button>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <div class="search-box">
                        <input
                            type="text"
                            class="search-input"
                            id="searchInput"
                            placeholder="🔍 Search applications..."
                            onkeyup="filterApps()"
                        >
                        <select class="filter-select" id="statusFilter" onchange="filterApps()">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="filter-tabs" id="filterTabs"></div>
                </div>

                <!-- Stats -->
                <div class="stats" id="statsDiv"></div>

                <!-- Applications Grid -->
                <div class="applications-grid" id="applicationsGrid">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <h2>Loading applications...</h2>
                    </div>
                </div>

                <div class="scroll-sentinel" id="scrollSentinel">
                    <span>⏳ Loading more applications...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Credentials Modal -->
    <div class="modal" id="credentialsModal" onclick="if(event.target.id === 'credentialsModal') closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modalTitle"></div>

            <div id="credentialFieldsDisplay"></div>
        </div>
    </div>

    <script>
        let applications = [];
        let sessionId = null;
        let isAdminUser = false;
        let currentFiltered = [];
        let visibleCount = 0;
        const BATCH_SIZE = 12;
        const STATUS_REFRESH_INTERVAL_MS = 30 * 1000;
        const URL_CHECK_TIMEOUT_MS = 5000;

        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    loadMoreApps();
                }
            });
        }, { rootMargin: '200px' });

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', async () => {
            const adminSessionId = localStorage.getItem('sessionId');
            const portalSessionId = localStorage.getItem('portalSessionId');

            if (adminSessionId) {
                isAdminUser = true;
                sessionId = adminSessionId;
                document.getElementById('adminLink').style.display = 'inline-block';
                document.getElementById('userTypeIndicator').textContent = '👤 Admin User (Full Access)';
            } else if (portalSessionId) {
                isAdminUser = false;
                sessionId = portalSessionId;
                document.getElementById('userTypeIndicator').textContent = '👤 Portal User';
            } else {
                document.getElementById('userTypeIndicator').textContent = '👀 Browsing — login to view credentials';
                document.getElementById('loginLink').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
            }

            document.getElementById('portalSection').classList.add('visible');
            loadApplications();
            setInterval(refreshApplicationsData, STATUS_REFRESH_INTERVAL_MS);
        });

        // ==================== AUTHENTICATION ====================
        async function handleLogout() {
            if (sessionId) {
                try {
                    const logoutType = isAdminUser ? 'admin' : 'portal';
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId, type: logoutType })
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            localStorage.removeItem('portalSessionId');
            localStorage.removeItem('sessionId');
            window.location.href = 'frontend.html';
        }

        function requireLoginFor(action) {
            if (!sessionId) {
                window.location.href = 'login.html';
                return;
            }
            action();
        }

        // ==================== LOAD APPLICATIONS ====================
        function normalizeCategories(app) {
            if (Array.isArray(app.categories) && app.categories.length) return app.categories;
            if (app.category) return [app.category];
            return [];
        }

        function normalizeCredentials(app) {
            if (Array.isArray(app.credentials) && app.credentials.length) return app.credentials;
            if (app.username || app.password) {
                return [{
                    label: 'Default',
                    username: app.username || '',
                    password: app.password || '',
                    extraFields: []
                }];
            }
            return [];
        }

        function normalizeUrls(app) {
            if (Array.isArray(app.urls) && app.urls.length) return app.urls;
            if (app.url) return [{ label: 'Default', url: app.url }];
            return [];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function loadApplications() {
            try {
                const response = await fetch('/data.json');
                if (!response.ok) throw new Error('Failed to load data');
                const raw = await response.json();
                const statusCache = loadStatusCache();
                applications = raw.map(app => ({
                    ...app,
                    categories: normalizeCategories(app),
                    credentials: normalizeCredentials(app),
                    urls: normalizeUrls(app),
                    isActive: statusCache[app.id] ?? null // last known status, unknown if never checked
                }));
                lazyLoadObserver.observe(document.getElementById('scrollSentinel'));
                renderFilterTabs();
                renderStats();
                visibleCount = BATCH_SIZE;
                renderApps();
                refreshLiveStatuses();
            } catch (error) {
                console.error('Error loading applications:', error);
            }
        }

        // ==================== LIVE STATUS (CHECKED FROM THIS BROWSER) ====================
        // The server can't always reach internal/company URLs (DNS/network segregation on the
        // deployment host), but staff browsers on the corporate network usually can. So status
        // is checked client-side instead of trusting a server-computed value. Cross-origin fetch
        // can't read the real HTTP status code (browser security), so this only distinguishes
        // "responded at all" from "no response" — not 200 vs 500.
        const STATUS_CACHE_KEY = 'appStatusCache';

        function loadStatusCache() {
            try {
                return JSON.parse(localStorage.getItem(STATUS_CACHE_KEY)) || {};
            } catch (error) {
                console.error('Error reading status cache:', error.message);
                return {};
            }
        }

        function saveStatusToCache(appId, isActive) {
            const cache = loadStatusCache();
            cache[appId] = isActive;
            localStorage.setItem(STATUS_CACHE_KEY, JSON.stringify(cache));
        }

        function checkUrlReachable(targetUrl, timeoutMs = URL_CHECK_TIMEOUT_MS) {
            return new Promise((resolve) => {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                fetch(targetUrl, { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
                    .then(() => resolve(true))
                    .catch(() => resolve(false))
                    .finally(() => clearTimeout(timer));
            });
        }

        // Checks every URL individually (so the launch menu can disable specific dead links)
        // and also returns the aggregate — an app with multiple URLs counts as active overall
        // if any one of them responds.
        function checkAppReachable(app) {
            return Promise.all(app.urls.map(u => checkUrlReachable(u.url)))
                .then(urlStatuses => ({ urlStatuses, isActive: urlStatuses.some(reachable => reachable) }));
        }

        // Cards render immediately with cached/unknown status; each app's status updates on
        // screen independently as soon as its own check resolves, without waiting on the others.
        function refreshLiveStatuses() {
            applications.forEach(app => {
                checkAppReachable(app).then(({ urlStatuses, isActive }) => {
                    app.isActive = isActive;
                    app.urlStatuses = urlStatuses;
                    saveStatusToCache(app.id, isActive);
                    renderFilterTabs();
                    const filtered = getFilteredApplications();
                    renderStats(filtered);
                    renderApps(filtered);
                });
            });
        }

        // ==================== FILTER TABS ====================
        function renderFilterTabs() {
            const categories = ['All', ...new Set(applications.flatMap(a => a.categories))];
            const tabsContainer = document.getElementById('filterTabs');

            tabsContainer.innerHTML = categories.map(category => {
                const count = category === 'All' ? applications.length : applications.filter(a => a.categories.includes(category)).length;
                return `
                    <button class="filter-tab ${category === 'All' ? 'active' : ''}" onclick="selectCategory('${category}')">
                        ${category}
                        <span class="filter-count">(${count})</span>
                    </button>
                `;
            }).join('');
        }

        let selectedCategory = 'All';

        function selectCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.closest('.filter-tab').classList.add('active');
            filterApps();
        }

        // ==================== FILTER APPLICATIONS ====================
        function getFilteredApplications() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const statusValue = document.getElementById('statusFilter').value;
            return applications.filter(app => {
                const matchesCategory = selectedCategory === 'All' || app.categories.includes(selectedCategory);
                const matchesSearch = app.name.toLowerCase().includes(searchText) ||
                                    app.description.toLowerCase().includes(searchText);
                const matchesStatus = statusValue === 'all' ||
                    (statusValue === 'active' && app.isActive === true) ||
                    (statusValue === 'inactive' && app.isActive === false);
                return matchesCategory && matchesSearch && matchesStatus;
            }).sort((a, b) => a.name.localeCompare(b.name));
        }

        function filterApps() {
            visibleCount = BATCH_SIZE;
            const filtered = getFilteredApplications();
            renderStats(filtered);
            renderApps(filtered);
        }

        // Background refresh: re-fetches the application list (to pick up admin add/edit/delete)
        // without resetting search/filter/scroll state, then re-checks reachability from this
        // browser. Previous known status is carried over so the UI doesn't flash back to
        // "checking" every refresh cycle.
        async function refreshApplicationsData() {
            try {
                const response = await fetch('/data.json');
                if (!response.ok) return;
                const raw = await response.json();
                const previousStatus = Object.fromEntries(applications.map(a => [a.id, a.isActive]));
                const statusCache = loadStatusCache();
                applications = raw.map(app => ({
                    ...app,
                    categories: normalizeCategories(app),
                    credentials: normalizeCredentials(app),
                    urls: normalizeUrls(app),
                    isActive: previousStatus[app.id] ?? statusCache[app.id] ?? null
                }));
                renderFilterTabs();
                const filtered = getFilteredApplications();
                renderStats(filtered);
                renderApps(filtered);
                refreshLiveStatuses();
            } catch (error) {
                console.error('Error refreshing applications:', error);
            }
        }

        // ==================== RENDER STATS ====================
        function renderStats(filtered = applications) {
            const statsDiv = document.getElementById('statsDiv');
            statsDiv.textContent = `Showing ${filtered.length} of ${applications.length} applications`;
        }

        // ==================== RENDER APPLICATIONS ====================
        // Only shown when the visitor has an active session — anonymous browsing hides the
        // credentials trigger entirely instead of just gating the click.
        function renderKeyButton(app, usable) {
            const disabledAttr = usable ? '' : 'disabled';
            const title = usable ? 'View credentials' : 'This app is inactive';
            const onclick = usable ? `requireLoginFor(() => showCredentials(${app.id}))` : 'return false;';
            return `<button class="icon-btn copy-btn card-key-btn" onclick="${onclick}" ${disabledAttr} title="${title}">🔑</button>`;
        }

        // Single-URL apps get a plain Launch App button. Apps with more than one URL get a
        // dropdown button instead: clicking it reveals one button per URL underneath.
        function renderLaunchRow(app, usable) {
            const disabledAttr = usable ? '' : 'disabled';
            const title = usable ? 'Launch application' : 'This app is inactive';
            if (app.urls.length <= 1) {
                const onclick = usable ? `launchApp(${app.id})` : 'return false;';
                return `<button class="launch-btn" onclick="${onclick}" ${disabledAttr} title="${title}">🚀 Launch App</button>`;
            }
            const toggleOnclick = usable ? `toggleLaunchMenu(event, ${app.id})` : 'return false;';
            const menuItems = app.urls.map((u, idx) => {
                const urlUsable = app.urlStatuses ? app.urlStatuses[idx] === true : false;
                const itemDisabledAttr = urlUsable ? '' : 'disabled';
                const itemTitle = urlUsable ? `Launch ${escapeHtml(u.label)}` : 'This URL is not responding';
                const itemOnclick = urlUsable ? `launchAppUrl(${app.id}, ${idx})` : 'return false;';
                return `<button type="button" class="launch-menu-item" onclick="${itemOnclick}" ${itemDisabledAttr} title="${itemTitle}">${escapeHtml(u.label)}</button>`;
            }).join('');
            return `
                <div class="launch-dropdown">
                    <button class="launch-btn" onclick="${toggleOnclick}" ${disabledAttr} title="${title}">🚀 Launch App ▾</button>
                    <div class="launch-menu" id="launchMenu-${app.id}">${menuItems}</div>
                </div>
            `;
        }

        function launchApp(appId) {
            const app = applications.find(a => a.id === appId);
            if (!app || !app.urls.length) return;
            window.open(app.urls[0].url, '_blank');
        }

        function launchAppUrl(appId, index) {
            const app = applications.find(a => a.id === appId);
            if (!app || !app.urls[index]) return;
            window.open(app.urls[index].url, '_blank');
            closeLaunchMenu(appId);
        }

        function toggleLaunchMenu(event, appId) {
            event.stopPropagation();
            const menu = document.getElementById(`launchMenu-${appId}`);
            if (!menu) return;
            const isOpen = menu.classList.contains('show');
            document.querySelectorAll('.launch-menu.show').forEach(m => m.classList.remove('show'));
            if (!isOpen) menu.classList.add('show');
        }

        function closeLaunchMenu(appId) {
            const menu = document.getElementById(`launchMenu-${appId}`);
            if (menu) menu.classList.remove('show');
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.launch-menu.show').forEach(m => m.classList.remove('show'));
        });

        function renderApps(filtered = applications) {
            currentFiltered = filtered;
            const grid = document.getElementById('applicationsGrid');

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h2>No applications found</h2>
                            <p style="color: #668899;">Try adjusting your search or filter</p>
                        </div>
                    </div>
                `;
                toggleSentinel(false);
                return;
            }

            const visibleApps = filtered.slice(0, visibleCount);

            grid.innerHTML = visibleApps.map(app => {
                const usable = app.isActive === true;
                const keyButton = sessionId ? renderKeyButton(app, usable) : '';
                return `
                <div class="app-card ${app.isActive === false ? 'inactive-card' : ''}">
                    ${keyButton}
                    <div class="card-header">
                        <div class="card-icon">${app.icon}</div>
                        <div class="card-name">${app.name}</div>
                    </div>
                    <div class="card-categories">${app.categories.map(c => `<span class="card-category">${c}</span>`).join('')}</div>
                    <div class="card-description" title="${app.description}">${app.description}</div>
                    <div class="card-divider"></div>
                    ${renderLaunchRow(app, usable)}
                </div>
            `;
            }).join('');

            toggleSentinel(visibleCount < filtered.length);
        }

        // ==================== LAZY LOADING ====================
        function toggleSentinel(show) {
            document.getElementById('scrollSentinel').style.display = show ? 'flex' : 'none';
        }

        function loadMoreApps() {
            if (visibleCount >= currentFiltered.length) return;
            visibleCount += BATCH_SIZE;
            renderApps(currentFiltered);
        }

        // ==================== CREDENTIALS MODAL ====================
        const MASK_PLACEHOLDER = '••••••••';

        async function decryptOnServer(value) {
            const response = await fetch(`/api/decrypt?sessionId=${sessionId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value })
            });
            if (!response.ok) throw new Error('Failed to decrypt');
            const data = await response.json();
            return data.value;
        }

        function renderFieldRow(label, value, masked, fieldId) {
            const displayValue = masked ? MASK_PLACEHOLDER : escapeHtml(value);
            return `
                <div class="credential-row">
                    <div class="credential-label">${escapeHtml(label)}</div>
                    <div class="credential-value">
                        <span class="credential-text" id="field-${fieldId}" data-value="${escapeHtml(value)}" data-masked="${masked}" data-revealed="false">${displayValue}</span>
                        ${masked ? `<button class="pwd-toggle" onclick="toggleFieldMask('field-${fieldId}')">👁️</button>` : ''}
                        <span class="copy-icon" onclick="copyFieldValue('field-${fieldId}')">📋</span>
                        <span class="copy-feedback" id="feedback-${fieldId}">✓ Copied!</span>
                    </div>
                </div>
            `;
        }

        function renderCredentialSetDisplay(cred, idx) {
            let html = `<div class="credential-set-label">${escapeHtml(cred.label)}</div>`;
            html += renderFieldRow('Username', cred.username, false, `user-${idx}`);
            html += renderFieldRow('Password', cred.password, true, `pass-${idx}`);
            cred.extraFields.forEach((field, fieldIdx) => {
                html += renderFieldRow(field.key, field.value, field.masked, `extra-${idx}-${fieldIdx}`);
            });
            return html;
        }

        function showCredentials(id) {
            const app = applications.find(a => a.id === id);
            if (!app) return;

            document.getElementById('modalTitle').textContent = `${app.name} Credentials`;

            let html = app.urls.map((u, idx) => renderFieldRow(u.label, u.url, false, `url-${idx}`)).join('');
            html += app.credentials.map((cred, idx) => renderCredentialSetDisplay(cred, idx)).join('');

            document.getElementById('credentialFieldsDisplay').innerHTML = html;
            document.getElementById('credentialsModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('credentialsModal').classList.remove('show');
        }

        async function getRealValue(el) {
            if (el.dataset.masked !== 'true') return el.dataset.value;
            if (el.dataset.decrypted !== undefined) return el.dataset.decrypted;
            const real = await decryptOnServer(el.dataset.value);
            el.dataset.decrypted = real;
            return real;
        }

        async function toggleFieldMask(elId) {
            const el = document.getElementById(elId);
            const revealed = el.dataset.revealed === 'true';

            if (revealed) {
                el.textContent = MASK_PLACEHOLDER;
                el.dataset.revealed = 'false';
                return;
            }

            try {
                el.textContent = await getRealValue(el);
                el.dataset.revealed = 'true';
            } catch (error) {
                console.error('Decrypt failed:', error);
                el.textContent = '⚠️ Error decrypting';
            }
        }

        async function copyFieldValue(elId) {
            const el = document.getElementById(elId);
            try {
                const real = await getRealValue(el);
                await navigator.clipboard.writeText(real);
                const feedbackId = elId.replace('field-', 'feedback-');
                const feedback = document.getElementById(feedbackId);
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 2000);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
