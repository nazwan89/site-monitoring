<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Application Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Portal Screen -->
        <div class="portal-container" id="portalSection">
            <div class="portal-content">
                <!-- Header -->
                <div class="header">
                    <div class="header-title">
                        <div class="header-logo">🏢</div>
                        <div>
                            <h1>Application Portal</h1>
                            <div class="user-info">
                                <span id="userTypeIndicator"></span>
                            </div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <a id="adminLink" href="management.html" class="admin-console-btn" style="display: none;">⚙️ Admin Console</a>
                        <button class="logout-btn" onclick="handleLogout()">🚪 Logout</button>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <div class="search-box">
                        <input
                            type="text"
                            class="search-input"
                            id="searchInput"
                            placeholder="🔍 Search applications..."
                            onkeyup="filterApps()"
                        >
                        <select class="filter-select" id="statusFilter" onchange="filterApps()">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="filter-tabs" id="filterTabs"></div>
                </div>

                <!-- Stats -->
                <div class="stats" id="statsDiv"></div>

                <!-- Applications Grid -->
                <div class="applications-grid" id="applicationsGrid">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <h2>Loading applications...</h2>
                    </div>
                </div>

                <div class="scroll-sentinel" id="scrollSentinel">
                    <span>⏳ Loading more applications...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Credentials Modal -->
    <div class="modal" id="credentialsModal" onclick="if(event.target.id === 'credentialsModal') closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modalTitle"></div>

            <div class="credential-row">
                <div class="credential-label">URL</div>
                <div class="credential-value">
                    <span class="credential-text" id="urlValue"></span>
                    <span class="copy-icon" onclick="copyToClipboard('urlValue')">📋</span>
                    <span class="copy-feedback" id="urlFeedback">✓ Copied!</span>
                </div>
            </div>

            <div class="credential-row">
                <div class="credential-label">Username</div>
                <div class="credential-value">
                    <span class="credential-text" id="usernameValue"></span>
                    <span class="copy-icon" onclick="copyToClipboard('usernameValue')">📋</span>
                    <span class="copy-feedback" id="usernameFeedback">✓ Copied!</span>
                </div>
            </div>

            <div class="credential-row">
                <div class="credential-label">Password</div>
                <div class="credential-value">
                    <span class="credential-text" id="passwordValue"></span>
                    <button class="pwd-toggle" id="pwdToggle" onclick="togglePassword()">👁️</button>
                    <span class="copy-icon" onclick="copyPassword()">📋</span>
                    <span class="copy-feedback" id="passwordFeedback">✓ Copied!</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let applications = [];
        let sessionId = null;
        let isAdminUser = false;
        let currentPassword = null;
        let currentFiltered = [];
        let visibleCount = 0;
        const BATCH_SIZE = 12;

        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    loadMoreApps();
                }
            });
        }, { rootMargin: '200px' });

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', async () => {
            const adminSessionId = localStorage.getItem('sessionId');
            if (adminSessionId) {
                isAdminUser = true;
                sessionId = adminSessionId;

                document.getElementById('portalSection').classList.add('visible');
                document.getElementById('adminLink').style.display = 'inline-block';
                document.getElementById('userTypeIndicator').textContent = '👤 Admin User (Full Access)';

                loadApplications();
                return;
            }

            const portalSessionId = localStorage.getItem('portalSessionId');
            if (portalSessionId) {
                isAdminUser = false;
                sessionId = portalSessionId;

                document.getElementById('portalSection').classList.add('visible');
                document.getElementById('userTypeIndicator').textContent = '👤 Portal User';

                loadApplications();
                return;
            }

            window.location.href = 'login.html';
        });

        // ==================== AUTHENTICATION ====================
        async function handleLogout() {
            if (sessionId) {
                try {
                    const logoutType = isAdminUser ? 'admin' : 'portal';
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId, type: logoutType })
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            localStorage.removeItem('portalSessionId');
            localStorage.removeItem('sessionId');
            window.location.href = 'login.html';
        }

        // ==================== LOAD APPLICATIONS ====================
        function normalizeCategories(app) {
            if (Array.isArray(app.categories) && app.categories.length) return app.categories;
            if (app.category) return [app.category];
            return [];
        }

        async function loadApplications() {
            try {
                const response = await fetch('/data.json');
                if (!response.ok) throw new Error('Failed to load data');
                const raw = await response.json();
                applications = raw.map(app => ({ ...app, categories: normalizeCategories(app) }));
                lazyLoadObserver.observe(document.getElementById('scrollSentinel'));
                renderFilterTabs();
                renderStats();
                visibleCount = BATCH_SIZE;
                renderApps();
            } catch (error) {
                console.error('Error loading applications:', error);
            }
        }

        // ==================== FILTER TABS ====================
        function renderFilterTabs() {
            const categories = ['All', ...new Set(applications.flatMap(a => a.categories))];
            const tabsContainer = document.getElementById('filterTabs');

            tabsContainer.innerHTML = categories.map(category => {
                const count = category === 'All' ? applications.length : applications.filter(a => a.categories.includes(category)).length;
                return `
                    <button class="filter-tab ${category === 'All' ? 'active' : ''}" onclick="selectCategory('${category}')">
                        ${category}
                        <span class="filter-count">(${count})</span>
                    </button>
                `;
            }).join('');
        }

        let selectedCategory = 'All';

        function selectCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.closest('.filter-tab').classList.add('active');
            filterApps();
        }

        // ==================== FILTER APPLICATIONS ====================
        function filterApps() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const statusValue = document.getElementById('statusFilter').value;
            const filtered = applications.filter(app => {
                const matchesCategory = selectedCategory === 'All' || app.categories.includes(selectedCategory);
                const matchesSearch = app.name.toLowerCase().includes(searchText) ||
                                    app.description.toLowerCase().includes(searchText);
                const matchesStatus = statusValue === 'all' ||
                    (statusValue === 'active' && app.isActive) ||
                    (statusValue === 'inactive' && !app.isActive);
                return matchesCategory && matchesSearch && matchesStatus;
            });

            visibleCount = BATCH_SIZE;
            renderStats(filtered);
            renderApps(filtered);
        }

        // ==================== RENDER STATS ====================
        function renderStats(filtered = applications) {
            const statsDiv = document.getElementById('statsDiv');
            statsDiv.textContent = `Showing ${filtered.length} of ${applications.length} applications`;
        }

        // ==================== RENDER APPLICATIONS ====================
        function renderApps(filtered = applications) {
            currentFiltered = filtered;
            const grid = document.getElementById('applicationsGrid');

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h2>No applications found</h2>
                            <p style="color: #668899;">Try adjusting your search or filter</p>
                        </div>
                    </div>
                `;
                toggleSentinel(false);
                return;
            }

            const visibleApps = filtered.slice(0, visibleCount);

            grid.innerHTML = visibleApps.map(app => `
                <div class="app-card ${!app.isActive ? 'inactive-card' : ''}">
                    <div class="card-icon">${app.icon}</div>
                    <div class="card-name">${app.name}</div>
                    <div class="card-categories">${app.categories.map(c => `<span class="card-category">${c}</span>`).join('')}</div>
                    <div class="card-description">${app.description}</div>
                    <div class="card-footer">
                        ${app.isActive ? '<div class="active-badge">✓ Active</div>' : '<div class="inactive-badge">✕ Inactive</div>'}
                        <div class="card-actions">
                            <button class="icon-btn copy-btn" 
                                    onclick="${app.isActive ? `showCredentials(${app.id}, '${app.name}', '${app.username}', '${app.password}')` : 'return false;'}"
                                    ${!app.isActive ? 'disabled' : ''}
                                    title="${!app.isActive ? 'This app is inactive' : 'View credentials'}">🔑</button>
                        </div>
                    </div>
                    <button class="launch-btn"
                            onclick="${app.isActive ? `window.open('${app.url}', '_blank')` : 'return false;'}"
                            ${!app.isActive ? 'disabled' : ''}
                            title="${!app.isActive ? 'This app is inactive' : 'Launch application'}">🚀 Launch App</button>
                </div>
            `).join('');

            toggleSentinel(visibleCount < filtered.length);
        }

        // ==================== LAZY LOADING ====================
        function toggleSentinel(show) {
            document.getElementById('scrollSentinel').style.display = show ? 'flex' : 'none';
        }

        function loadMoreApps() {
            if (visibleCount >= currentFiltered.length) return;
            visibleCount += BATCH_SIZE;
            renderApps(currentFiltered);
        }

        // ==================== CREDENTIALS MODAL ====================
        function showCredentials(id, name, username, password) {
            document.getElementById('modalTitle').textContent = `${name} Credentials`;
            document.getElementById('urlValue').textContent = applications.find(a => a.id === id)?.url || '';
            document.getElementById('usernameValue').textContent = username;
            document.getElementById('passwordValue').textContent = maskPassword(password);
            currentPassword = password;
            document.getElementById('pwdToggle').textContent = '👁️';
            document.getElementById('credentialsModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('credentialsModal').classList.remove('show');
            currentPassword = null;
        }

        function maskPassword(password) {
            return '*'.repeat(password.length);
        }

        function togglePassword() {
            const pwdElement = document.getElementById('passwordValue');
            const toggle = document.getElementById('pwdToggle');

            if (pwdElement.textContent.includes('*')) {
                pwdElement.textContent = currentPassword;
                toggle.textContent = '🙈';
            } else {
                pwdElement.textContent = maskPassword(currentPassword);
                toggle.textContent = '👁️';
            }
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const feedbackId = elementId.replace('Value', 'Feedback');
                const feedback = document.getElementById(feedbackId);
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 2000);
            });
        }

        function copyPassword() {
            navigator.clipboard.writeText(currentPassword).then(() => {
                const feedback = document.getElementById('passwordFeedback');
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 2000);
            });
        }

        // ==================== KEYBOARD SHORTCUTS ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
