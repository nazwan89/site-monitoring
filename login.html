<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function() {
            var pref = localStorage.getItem('theme') || 'system';
            if (pref === 'light' || pref === 'dark') {
                document.documentElement.setAttribute('data-theme', pref);
            }
        })();
    </script>
</head>
<body>
    <button type="button" class="theme-select theme-select-corner" id="themeToggle" title="Toggle theme">🌙</button>
    <div class="main-container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">🏢</div>
                    <h1>Millennium Radius</h1>
                    <p>Sign in to continue</p>
                </div>

                <form onsubmit="handleLogin(event)" id="loginForm">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required autofocus>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                    <div class="login-error" id="loginError"></div>
                </form>

                <div class="login-info">
                    <strong>ℹ️ Note:</strong><br>
                    Your password determines your access level. Portal password grants the
                    application portal; admin password grants the admin console (and portal access).
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== THEME ====================
        // No explicit UI choice for "system" — an explicit light/dark pick is stored and wins;
        // absent that, the theme silently tracks the OS preference (including live changes).
        function getEffectiveTheme() {
            const stored = localStorage.getItem('theme');
            if (stored === 'light' || stored === 'dark') return stored;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        function updateThemeIcon() {
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = getEffectiveTheme() === 'light' ? '☀️' : '🌙';
        }

        function applyTheme() {
            const stored = localStorage.getItem('theme');
            if (stored === 'light' || stored === 'dark') {
                document.documentElement.setAttribute('data-theme', stored);
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            localStorage.setItem('theme', getEffectiveTheme() === 'light' ? 'dark' : 'light');
            applyTheme();
        }

        function initThemeToggle() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            btn.addEventListener('click', toggleTheme);
            updateThemeIcon();
        }

        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
            const stored = localStorage.getItem('theme');
            if (stored !== 'light' && stored !== 'dark') applyTheme();
        });

        async function tryLogin(endpoint, password) {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const contentType = response.headers.get('content-type');
            if (!response.ok || !contentType || !contentType.includes('application/json')) {
                return null;
            }

            return response.json();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            loginError.classList.remove('show');

            try {
                const adminData = await tryLogin('/api/auth/admin/login', password);
                if (adminData && adminData.success) {
                    localStorage.setItem('sessionId', adminData.sessionId);
                    window.location.href = 'management.html';
                    return;
                }

                const portalData = await tryLogin('/api/auth/portal/login', password);
                if (portalData && portalData.success) {
                    localStorage.setItem('portalSessionId', portalData.sessionId);
                    window.location.href = 'frontend.html';
                    return;
                }

                loginError.textContent = '❌ Invalid password';
                loginError.classList.add('show');
                loginBtn.textContent = 'Sign In';
                loginBtn.disabled = false;
            } catch (error) {
                loginError.textContent = '❌ Error: ' + error.message;
                loginError.classList.add('show');
                loginBtn.textContent = 'Sign In';
                loginBtn.disabled = false;
            }
        }

        // Already signed in? Skip straight to the right destination.
        window.addEventListener('load', () => {
            initThemeToggle();
            if (localStorage.getItem('sessionId')) {
                window.location.href = 'management.html';
            } else if (localStorage.getItem('portalSessionId')) {
                window.location.href = 'frontend.html';
            }
        });
    </script>
</body>
</html>
