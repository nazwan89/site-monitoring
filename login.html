<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function() {
            var pref = localStorage.getItem('theme') || 'system';
            if (['light', 'dark', 'neumorphic-light', 'neumorphic-dark'].indexOf(pref) !== -1) {
                document.documentElement.setAttribute('data-theme', pref);
            }
        })();
    </script>
</head>
<body>
    <div class="theme-picker theme-select-corner">
        <button type="button" class="theme-select" id="themeToggle" title="Choose theme">🌙</button>
        <div class="theme-menu" id="themeMenu">
            <button type="button" class="theme-menu-item" data-theme-value="light" title="Light">☀️</button>
            <button type="button" class="theme-menu-item" data-theme-value="dark" title="Dark">🌙</button>
            <button type="button" class="theme-menu-item" data-theme-value="neumorphic-light" title="Neumorphic Light">🫧</button>
            <button type="button" class="theme-menu-item" data-theme-value="neumorphic-dark" title="Neumorphic Dark">🌑</button>
        </div>
    </div>
    <div class="main-container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">🏢</div>
                    <h1>Millennium Radius</h1>
                    <p>Sign in to continue</p>
                </div>

                <form onsubmit="handleLogin(event)" id="loginForm">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required autofocus>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                    <div class="login-error" id="loginError"></div>
                </form>

                <div class="login-info">
                    <strong>ℹ️ Note:</strong><br>
                    Your password determines your access level. Portal password grants the
                    application portal; admin password grants the admin console (and portal access).
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== THEME ====================
        // No explicit UI choice for "system" — an explicit pick is stored and wins; absent
        // that, the theme silently tracks the OS light/dark preference (including live
        // changes). The neumorphic variants are a preview here on the login page only — they're
        // never chosen automatically, only by picking them from the menu.
        const THEME_ICONS = { light: '☀️', dark: '🌙', 'neumorphic-light': '🫧', 'neumorphic-dark': '🌑' };
        const EXPLICIT_THEMES = Object.keys(THEME_ICONS);

        function getEffectiveTheme() {
            const stored = localStorage.getItem('theme');
            if (EXPLICIT_THEMES.indexOf(stored) !== -1) return stored;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        function updateThemeIcon() {
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = THEME_ICONS[getEffectiveTheme()];
        }

        function applyTheme() {
            const stored = localStorage.getItem('theme');
            if (EXPLICIT_THEMES.indexOf(stored) !== -1) {
                document.documentElement.setAttribute('data-theme', stored);
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            updateThemeIcon();
        }

        function selectTheme(value) {
            localStorage.setItem('theme', value);
            applyTheme();
            closeThemeMenu();
        }

        function toggleThemeMenu(event) {
            event.stopPropagation();
            document.getElementById('themeMenu').classList.toggle('show');
        }

        function closeThemeMenu() {
            document.getElementById('themeMenu').classList.remove('show');
        }

        function initThemeToggle() {
            const btn = document.getElementById('themeToggle');
            const menu = document.getElementById('themeMenu');
            if (!btn || !menu) return;
            btn.addEventListener('click', toggleThemeMenu);
            menu.querySelectorAll('.theme-menu-item').forEach(item => {
                item.addEventListener('click', () => selectTheme(item.dataset.themeValue));
            });
            document.addEventListener('click', closeThemeMenu);
            updateThemeIcon();
        }

        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
            const stored = localStorage.getItem('theme');
            if (EXPLICIT_THEMES.indexOf(stored) === -1) applyTheme();
        });

        async function tryLogin(endpoint, password) {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const contentType = response.headers.get('content-type');
            if (!response.ok || !contentType || !contentType.includes('application/json')) {
                return null;
            }

            return response.json();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            loginError.classList.remove('show');

            try {
                const adminData = await tryLogin('/api/auth/admin/login', password);
                if (adminData && adminData.success) {
                    localStorage.setItem('sessionId', adminData.sessionId);
                    window.location.href = 'management.html';
                    return;
                }

                const portalData = await tryLogin('/api/auth/portal/login', password);
                if (portalData && portalData.success) {
                    localStorage.setItem('portalSessionId', portalData.sessionId);
                    window.location.href = 'frontend.html';
                    return;
                }

                loginError.textContent = '❌ Invalid password';
                loginError.classList.add('show');
                loginBtn.textContent = 'Sign In';
                loginBtn.disabled = false;
            } catch (error) {
                loginError.textContent = '❌ Error: ' + error.message;
                loginError.classList.add('show');
                loginBtn.textContent = 'Sign In';
                loginBtn.disabled = false;
            }
        }

        // Already signed in? Skip straight to the right destination.
        window.addEventListener('load', () => {
            initThemeToggle();
            if (localStorage.getItem('sessionId')) {
                window.location.href = 'management.html';
            } else if (localStorage.getItem('portalSessionId')) {
                window.location.href = 'frontend.html';
            }
        });
    </script>
</body>
</html>
