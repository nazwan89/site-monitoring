<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Admin Console</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Dashboard -->
        <div class="dashboard" id="dashboardSection">
            <!-- Header -->
            <div class="header">
                <div class="header-title">
                    <div class="header-logo">⚙️</div>
                    <div>
                        <h1>Admin Console</h1>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="frontend.html" class="btn btn-primary">🏢 Portal</a>
                    <button class="btn btn-logout" onclick="handleLogout()">🚪 Logout</button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="section-header">
                    <div class="section-title">📋 Manage Applications</div>
                    <button class="btn btn-primary" onclick="openAddModal()">➕ Add New</button>
                </div>

                <div class="alert alert-success" id="successAlert"></div>
                <div class="alert alert-error" id="errorAlert"></div>

                <div class="search-box">
                    <input
                        type="text"
                        class="search-input"
                        id="tableSearchInput"
                        placeholder="🔍 Search by name, category, or description..."
                        onkeyup="handleSearchInput()"
                    >
                    <select class="filter-select" id="statusFilter" onchange="handleStatusFilterChange()">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Icon</th>
                                <th class="sortable" onclick="setSort('name')">Name<span class="sort-icon" id="sort-name"></span></th>
                                <th class="sortable" onclick="setSort('category')">Category<span class="sort-icon" id="sort-category"></span></th>
                                <th class="sortable" onclick="setSort('description')">Description<span class="sort-icon" id="sort-description"></span></th>
                                <th>URL</th>
                                <th class="sortable" onclick="setSort('isActive')">Status<span class="sort-icon" id="sort-isActive"></span></th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTable">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 40px;">
                                    <div class="empty-state">
                                        <div class="empty-state-icon">⏳</div>
                                        <h2>Loading applications...</h2>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination-bar">
                    <div class="rows-per-page">
                        <label for="rowsPerPageSelect">Rows per page:</label>
                        <select id="rowsPerPageSelect" onchange="handleRowsPerPageChange()">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal" id="addModal" onclick="if(event.target.id === 'addModal') closeAddModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAddModal()">✕</button>
            <div class="modal-title">Add New Application</div>

            <form onsubmit="addApplication(event)">
                <div class="form-grid">
                    <div class="form-group-full">
                        <label>Application Name *</label>
                        <input type="text" id="name" placeholder="e.g., Cognisense" required>
                    </div>

                    <div class="form-group-full">
                        <label>Icon (Emoji) *</label>
                        <input type="text" id="icon" placeholder="e.g., 🧠" maxlength="2" required>
                    </div>

                    <div class="form-group-full">
                        <label>Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Core Systems">Core Systems</option>
                            <option value="CRM">CRM</option>
                            <option value="Communication">Communication</option>
                            <option value="Project Management">Project Management</option>
                            <option value="Development">Development</option>
                            <option value="Analytics & Data">Analytics & Data</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Status *</label>
                        <select id="isActive" required>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Application URL *</label>
                        <input type="url" id="url" placeholder="https://example.com" required>
                    </div>

                    <div class="form-group-full">
                        <label>Username *</label>
                        <input type="text" id="username" placeholder="user@company.com" required>
                    </div>

                    <div class="form-group-full">
                        <label>Password *</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-group-full">
                        <label>Description *</label>
                        <textarea id="description" placeholder="Brief description of the application" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">✅ Add Application</button>
                        <button type="button" class="btn btn-neutral" onclick="closeAddModal()">❌ Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal" onclick="if(event.target.id === 'editModal') closeEditModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">✕</button>
            <div class="modal-title">Edit Application</div>

            <form onsubmit="updateApplication(event)">
                <input type="hidden" id="editId">

                <div class="form-grid">
                    <div class="form-group-full">
                        <label>Application Name *</label>
                        <input type="text" id="editName" required>
                    </div>

                    <div class="form-group-full">
                        <label>Icon (Emoji) *</label>
                        <input type="text" id="editIcon" maxlength="2" required>
                    </div>

                    <div class="form-group-full">
                        <label>Category *</label>
                        <select id="editCategory" required>
                            <option value="Core Systems">Core Systems</option>
                            <option value="CRM">CRM</option>
                            <option value="Communication">Communication</option>
                            <option value="Project Management">Project Management</option>
                            <option value="Development">Development</option>
                            <option value="Analytics & Data">Analytics & Data</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Status *</label>
                        <select id="editIsActive" required>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Application URL *</label>
                        <input type="url" id="editUrl" required>
                    </div>

                    <div class="form-group-full">
                        <label>Username *</label>
                        <input type="text" id="editUsername" required>
                    </div>

                    <div class="form-group-full">
                        <label>Password *</label>
                        <input type="password" id="editPassword" required>
                    </div>

                    <div class="form-group-full">
                        <label>Description *</label>
                        <textarea id="editDescription" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">✅ Save Changes</button>
                        <button type="button" class="btn btn-neutral" onclick="closeEditModal()">❌ Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let applications = [];
        let sessionId = null;
        let sortColumn = null;
        let sortDirection = 'asc';
        let currentPage = 1;
        let pageSize = 5;

        // ==================== AUTHENTICATION ====================
        async function handleLogout() {
            if (sessionId) {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId, type: 'admin' })
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            localStorage.removeItem('sessionId');
            window.location.href = 'login.html';
        }

        // ==================== LOAD APPLICATIONS ====================
        async function loadApplications() {
            try {
                const response = await fetch('/data.json');
                if (!response.ok) throw new Error('Failed to load data');
                applications = await response.json();
                renderTable();
            } catch (error) {
                showAlert('error', '❌ Error loading applications: ' + error.message);
            }
        }

        // ==================== FILTER & SORT ====================
        function handleSearchInput() {
            currentPage = 1;
            renderTable();
        }

        function handleStatusFilterChange() {
            currentPage = 1;
            renderTable();
        }

        function setSort(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            currentPage = 1;
            renderTable();
        }

        function updateSortIndicators() {
            document.querySelectorAll('.sortable .sort-icon').forEach(el => el.textContent = '');
            if (sortColumn) {
                const el = document.getElementById('sort-' + sortColumn);
                if (el) el.textContent = sortDirection === 'asc' ? ' ▲' : ' ▼';
            }
        }

        function getFilteredSortedApplications() {
            const searchText = document.getElementById('tableSearchInput').value.toLowerCase();
            const statusValue = document.getElementById('statusFilter').value;
            const filtered = applications.filter(app => {
                const matchesSearch = app.name.toLowerCase().includes(searchText) ||
                    app.category.toLowerCase().includes(searchText) ||
                    app.description.toLowerCase().includes(searchText);
                const matchesStatus = statusValue === 'all' ||
                    (statusValue === 'active' && app.isActive) ||
                    (statusValue === 'inactive' && !app.isActive);
                return matchesSearch && matchesStatus;
            });

            if (sortColumn) {
                filtered.sort((a, b) => {
                    let valA = a[sortColumn];
                    let valB = b[sortColumn];
                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();
                    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            return filtered;
        }

        // ==================== RENDER TABLE ====================
        function renderTable() {
            const tbody = document.getElementById('applicationsTable');
            updateSortIndicators();

            if (applications.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <h2>No applications found</h2>
                                <p style="color: #668899;">Click "Add New" to create your first application</p>
                            </div>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const filtered = getFilteredSortedApplications();

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            <div class="empty-state">
                                <div class="empty-state-icon">🔍</div>
                                <h2>No matching applications</h2>
                                <p style="color: #668899;">Try a different search term</p>
                            </div>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
            currentPage = Math.min(Math.max(currentPage, 1), totalPages);

            const start = (currentPage - 1) * pageSize;
            const pageItems = filtered.slice(start, start + pageSize);

            tbody.innerHTML = pageItems.map(app => `
                <tr>
                    <td class="icon-cell">${app.icon}</td>
                    <td><strong>${app.name}</strong></td>
                    <td>${app.category}</td>
                    <td>${app.description}</td>
                    <td><a href="${app.url}" target="_blank" style="color: #64c8ff; text-decoration: none;">Open →</a></td>
                    <td><span class="status-badge ${app.isActive ? 'status-active' : 'status-inactive'}">${app.isActive ? '✓ Active' : '✗ Inactive'}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-edit" onclick="openEditModal(${app.id})">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteApplication(${app.id})">🗑️ Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(filtered.length, totalPages);
        }

        // ==================== PAGINATION ====================
        const MAX_PAGE_BUTTONS = 3;

        function renderPagination(filteredCount, totalPages) {
            const el = document.getElementById('pagination');
            const start = (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, filteredCount);

            let html = `<div class="pagination-info">Showing ${start}-${end} of ${filteredCount}</div>`;

            if (totalPages > 1) {
                let startPage = Math.max(1, currentPage - Math.floor(MAX_PAGE_BUTTONS / 2));
                let endPage = Math.min(totalPages, startPage + MAX_PAGE_BUTTONS - 1);
                startPage = Math.max(1, endPage - MAX_PAGE_BUTTONS + 1);

                const atStart = currentPage === 1;
                const atEnd = currentPage === totalPages;

                html += '<div class="pagination-controls">';
                html += `<button class="page-btn" onclick="goToPage(1)" ${atStart ? 'disabled' : ''}>« First</button>`;
                html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${atStart ? 'disabled' : ''}>‹ Prev</button>`;
                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${atEnd ? 'disabled' : ''}>Next ›</button>`;
                html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${atEnd ? 'disabled' : ''}>Last »</button>`;
                html += '</div>';
            }

            el.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
        }

        function handleRowsPerPageChange() {
            pageSize = parseInt(document.getElementById('rowsPerPageSelect').value);
            currentPage = 1;
            renderTable();
        }

        // ==================== ADD APPLICATION ====================
        async function addApplication(event) {
            event.preventDefault();

            const newApp = {
                id: Math.max(...applications.map(a => a.id), 0) + 1,
                name: document.getElementById('name').value,
                icon: document.getElementById('icon').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                url: document.getElementById('url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                isActive: document.getElementById('isActive').value === 'true'
            };

            try {
                const response = await fetch(`/api/applications?sessionId=${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newApp)
                });

                if (!response.ok) throw new Error('Failed to add application');

                applications.push(newApp);
                renderTable();
                event.target.reset();
                closeAddModal();
                showAlert('success', '✅ Application added successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== ADD MODAL ====================
        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
        }

        // ==================== EDIT APPLICATION ====================
        function openEditModal(id) {
            const app = applications.find(a => a.id === id);
            if (!app) return;

            document.getElementById('editId').value = app.id;
            document.getElementById('editName').value = app.name;
            document.getElementById('editIcon').value = app.icon;
            document.getElementById('editCategory').value = app.category;
            document.getElementById('editIsActive').value = app.isActive;
            document.getElementById('editUrl').value = app.url;
            document.getElementById('editUsername').value = app.username;
            document.getElementById('editPassword').value = app.password;
            document.getElementById('editDescription').value = app.description;

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        async function updateApplication(event) {
            event.preventDefault();

            const id = parseInt(document.getElementById('editId').value);
            const updatedApp = {
                id: id,
                name: document.getElementById('editName').value,
                icon: document.getElementById('editIcon').value,
                category: document.getElementById('editCategory').value,
                description: document.getElementById('editDescription').value,
                url: document.getElementById('editUrl').value,
                username: document.getElementById('editUsername').value,
                password: document.getElementById('editPassword').value,
                isActive: document.getElementById('editIsActive').value === 'true'
            };

            try {
                const response = await fetch(`/api/applications/${id}?sessionId=${sessionId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedApp)
                });

                if (!response.ok) throw new Error('Failed to update application');

                const index = applications.findIndex(a => a.id === id);
                if (index !== -1) {
                    applications[index] = updatedApp;
                }
                renderTable();
                closeEditModal();
                showAlert('success', '✅ Application updated successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== DELETE APPLICATION ====================
        async function deleteApplication(id) {
            if (!confirm('Are you sure you want to delete this application?')) return;

            try {
                const response = await fetch(`/api/applications/${id}?sessionId=${sessionId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete application');

                applications = applications.filter(a => a.id !== id);
                renderTable();
                showAlert('success', '✅ Application deleted successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== ALERTS ====================
        function showAlert(type, message) {
            const alertEl = document.getElementById(type + 'Alert');
            alertEl.textContent = message;
            alertEl.classList.add('show');

            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 4000);
        }

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', () => {
            const savedSessionId = localStorage.getItem('sessionId');
            if (savedSessionId) {
                sessionId = savedSessionId;
                document.getElementById('dashboardSection').classList.add('visible');
                loadApplications();
            } else {
                window.location.href = 'login.html';
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAddModal();
                closeEditModal();
            }
        });
    </script>
</body>
</html>
