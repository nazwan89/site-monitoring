<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Admin Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Login Modal */
        .login-modal {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-card.hidden {
            display: none;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }

        .login-header h1 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-error {
            color: #dc2626;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .demo-credentials {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #1e40af;
            line-height: 1.6;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard.visible {
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .header h1 {
            font-size: 28px;
            color: #1f2937;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-logout {
            background: #ef4444;
            color: white;
        }

        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Main Content */
        .main-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: #1f2937;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group-full {
            display: flex;
            flex-direction: column;
        }

        .form-group-full label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group-full input,
        .form-group-full select,
        .form-group-full textarea {
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group-full textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group-full input:focus,
        .form-group-full select:focus,
        .form-group-full textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #f9fafb;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .icon-cell {
            font-size: 24px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }

        .modal-close:hover {
            color: #1f2937;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            margin-right: 30px;
        }

        /* Alert */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                padding: 30px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Modal -->
        <div class="login-modal" id="loginSection">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">🔐</div>
                    <h1>Admin Console</h1>
                    <p>Millennium Radius Management</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter admin password" required autofocus>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">Login</button>
                    <div class="login-error" id="loginError"></div>
                </form>

                <div class="demo-credentials">
                    <strong>ℹ️ Default Password:</strong><br>
                    <code>admin123</code><br><br>
                    <strong>Note:</strong> Password is validated on the server for security.
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboardSection">
            <!-- Header -->
            <div class="header">
                <div class="header-title">
                    <div class="header-logo">⚙️</div>
                    <div>
                        <h1>Admin Console</h1>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="frontend.html" class="btn btn-primary">🏢 Portal</a>
                    <button class="btn btn-logout" onclick="handleLogout()">🚪 Logout</button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('applications')">📋 Applications</button>
                    <button class="tab-btn" onclick="switchTab('add')">➕ Add New</button>
                </div>

                <!-- Tab: Applications -->
                <div id="applications-tab" class="tab-content active">
                    <div class="section-title">📋 Manage Applications</div>
                    
                    <div class="alert alert-success" id="successAlert"></div>
                    <div class="alert alert-error" id="errorAlert"></div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Icon</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>URL</th>
                                    <th>Username</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="applicationsTable">
                                <tr>
                                    <td colspan="7" style="text-align: center; padding: 40px;">
                                        <div class="empty-state">
                                            <div class="empty-state-icon">⏳</div>
                                            <h2>Loading applications...</h2>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Tab: Add New -->
                <div id="add-tab" class="tab-content">
                    <div class="section-title">➕ Add New Application</div>

                    <form onsubmit="addApplication(event)">
                        <div class="form-grid">
                            <div class="form-group-full">
                                <label>Application Name *</label>
                                <input type="text" id="name" placeholder="e.g., Cognisense" required>
                            </div>

                            <div class="form-group-full">
                                <label>Icon (Emoji) *</label>
                                <input type="text" id="icon" placeholder="e.g., 🧠" maxlength="2" required>
                            </div>

                            <div class="form-group-full">
                                <label>Category *</label>
                                <select id="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Core Systems">Core Systems</option>
                                    <option value="CRM">CRM</option>
                                    <option value="Communication">Communication</option>
                                    <option value="Project Management">Project Management</option>
                                    <option value="Development">Development</option>
                                    <option value="Analytics & Data">Analytics & Data</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="form-group-full">
                                <label>Status *</label>
                                <select id="isActive" required>
                                    <option value="true">Active</option>
                                    <option value="false">Inactive</option>
                                </select>
                            </div>

                            <div class="form-group-full">
                                <label>Application URL *</label>
                                <input type="url" id="url" placeholder="https://example.com" required>
                            </div>

                            <div class="form-group-full">
                                <label>Username *</label>
                                <input type="text" id="username" placeholder="user@company.com" required>
                            </div>

                            <div class="form-group-full">
                                <label>Password *</label>
                                <input type="password" id="password" placeholder="••••••••" required>
                            </div>

                            <div class="form-group-full">
                                <label>Description *</label>
                                <textarea id="description" placeholder="Brief description of the application" required></textarea>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">✅ Add Application</button>
                                <button type="reset" class="btn" style="background: #f3f4f6; color: #374151;">🔄 Clear Form</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal" onclick="if(event.target.id === 'editModal') closeEditModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">✕</button>
            <div class="modal-title">Edit Application</div>

            <form onsubmit="updateApplication(event)">
                <input type="hidden" id="editId">

                <div class="form-grid">
                    <div class="form-group-full">
                        <label>Application Name *</label>
                        <input type="text" id="editName" required>
                    </div>

                    <div class="form-group-full">
                        <label>Icon (Emoji) *</label>
                        <input type="text" id="editIcon" maxlength="2" required>
                    </div>

                    <div class="form-group-full">
                        <label>Category *</label>
                        <select id="editCategory" required>
                            <option value="Core Systems">Core Systems</option>
                            <option value="CRM">CRM</option>
                            <option value="Communication">Communication</option>
                            <option value="Project Management">Project Management</option>
                            <option value="Development">Development</option>
                            <option value="Analytics & Data">Analytics & Data</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Status *</label>
                        <select id="editIsActive" required>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Application URL *</label>
                        <input type="url" id="editUrl" required>
                    </div>

                    <div class="form-group-full">
                        <label>Username *</label>
                        <input type="text" id="editUsername" required>
                    </div>

                    <div class="form-group-full">
                        <label>Password *</label>
                        <input type="password" id="editPassword" required>
                    </div>

                    <div class="form-group-full">
                        <label>Description *</label>
                        <textarea id="editDescription" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">✅ Save Changes</button>
                        <button type="button" class="btn" onclick="closeEditModal()" style="background: #f3f4f6; color: #374151;">❌ Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let applications = [];
        let sessionId = null;

        // ==================== AUTHENTICATION ====================
        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                // Check if response is OK first
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server error:', response.status, errorText);
                    throw new Error(`Server error: ${response.status}`);
                }

                // Check content type before parsing
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('Invalid content type:', contentType, 'Response:', text);
                    throw new Error('Server returned non-JSON response');
                }

                const data = await response.json();

                if (data.success) {
                    sessionId = data.sessionId;
                    localStorage.setItem('sessionId', sessionId);
                    
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dashboardSection').classList.add('visible');
                    loadApplications();
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                } else {
                    loginError.textContent = '❌ ' + (data.error || 'Login failed');
                    loginError.classList.add('show');
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                    setTimeout(() => loginError.classList.remove('show'), 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = '❌ Error: ' + error.message;
                loginError.classList.add('show');
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
            }
        }

        async function handleLogout() {
            if (sessionId) {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId, type: 'admin' })
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            sessionId = null;
            localStorage.removeItem('sessionId');
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('dashboardSection').classList.remove('visible');
            document.getElementById('adminPassword').value = '';
        }

        // ==================== LOAD APPLICATIONS ====================
        async function loadApplications() {
            try {
                const response = await fetch('/data.json');
                if (!response.ok) throw new Error('Failed to load data');
                applications = await response.json();
                renderTable();
            } catch (error) {
                showAlert('error', '❌ Error loading applications: ' + error.message);
            }
        }

        // ==================== RENDER TABLE ====================
        function renderTable() {
            const tbody = document.getElementById('applicationsTable');

            if (applications.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <h2>No applications found</h2>
                                <p style="color: #9ca3af;">Use the "Add New" tab to create your first application</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = applications.map(app => `
                <tr>
                    <td class="icon-cell">${app.icon}</td>
                    <td><strong>${app.name}</strong></td>
                    <td>${app.category}</td>
                    <td><a href="${app.url}" target="_blank" style="color: #667eea; text-decoration: none;">Open →</a></td>
                    <td>${app.username}</td>
                    <td><span class="status-badge ${app.isActive ? 'status-active' : 'status-inactive'}">${app.isActive ? '✓ Active' : '✗ Inactive'}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-edit" onclick="openEditModal(${app.id})">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteApplication(${app.id})">🗑️ Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // ==================== ADD APPLICATION ====================
        async function addApplication(event) {
            event.preventDefault();

            const newApp = {
                id: Math.max(...applications.map(a => a.id), 0) + 1,
                name: document.getElementById('name').value,
                icon: document.getElementById('icon').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                url: document.getElementById('url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                isActive: document.getElementById('isActive').value === 'true'
            };

            try {
                const response = await fetch(`/api/applications?sessionId=${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newApp)
                });

                if (!response.ok) throw new Error('Failed to add application');

                applications.push(newApp);
                renderTable();
                event.target.reset();
                showAlert('success', '✅ Application added successfully!');
                switchTab('applications');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== EDIT APPLICATION ====================
        function openEditModal(id) {
            const app = applications.find(a => a.id === id);
            if (!app) return;

            document.getElementById('editId').value = app.id;
            document.getElementById('editName').value = app.name;
            document.getElementById('editIcon').value = app.icon;
            document.getElementById('editCategory').value = app.category;
            document.getElementById('editIsActive').value = app.isActive;
            document.getElementById('editUrl').value = app.url;
            document.getElementById('editUsername').value = app.username;
            document.getElementById('editPassword').value = app.password;
            document.getElementById('editDescription').value = app.description;

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        async function updateApplication(event) {
            event.preventDefault();

            const id = parseInt(document.getElementById('editId').value);
            const updatedApp = {
                id: id,
                name: document.getElementById('editName').value,
                icon: document.getElementById('editIcon').value,
                category: document.getElementById('editCategory').value,
                description: document.getElementById('editDescription').value,
                url: document.getElementById('editUrl').value,
                username: document.getElementById('editUsername').value,
                password: document.getElementById('editPassword').value,
                isActive: document.getElementById('editIsActive').value === 'true'
            };

            try {
                const response = await fetch(`/api/applications/${id}?sessionId=${sessionId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedApp)
                });

                if (!response.ok) throw new Error('Failed to update application');

                const index = applications.findIndex(a => a.id === id);
                if (index !== -1) {
                    applications[index] = updatedApp;
                }
                renderTable();
                closeEditModal();
                showAlert('success', '✅ Application updated successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== DELETE APPLICATION ====================
        async function deleteApplication(id) {
            if (!confirm('Are you sure you want to delete this application?')) return;

            try {
                const response = await fetch(`/api/applications/${id}?sessionId=${sessionId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete application');

                applications = applications.filter(a => a.id !== id);
                renderTable();
                showAlert('success', '✅ Application deleted successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== TAB SWITCHING ====================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        // ==================== ALERTS ====================
        function showAlert(type, message) {
            const alertEl = document.getElementById(type + 'Alert');
            alertEl.textContent = message;
            alertEl.classList.add('show');

            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 4000);
        }

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', () => {
            const savedSessionId = localStorage.getItem('sessionId');
            if (savedSessionId) {
                sessionId = savedSessionId;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').classList.add('visible');
                loadApplications();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
