<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Radius - Admin Console</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Modal -->
        <div class="login-modal" id="loginSection">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">🔐</div>
                    <h1>Admin Console</h1>
                    <p>Millennium Radius Management</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter admin password" required autofocus>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">Login</button>
                    <div class="login-error" id="loginError"></div>
                </form>

                <div class="demo-credentials">
                    <strong>ℹ️ Default Password:</strong><br>
                    <code>admin123</code><br><br>
                    <strong>Note:</strong> Password is validated on the server for security.
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboardSection">
            <!-- Header -->
            <div class="header">
                <div class="header-title">
                    <div class="header-logo">⚙️</div>
                    <div>
                        <h1>Admin Console</h1>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="frontend.html" class="btn btn-primary">🏢 Portal</a>
                    <button class="btn btn-logout" onclick="handleLogout()">🚪 Logout</button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="section-header">
                    <div class="section-title">📋 Manage Applications</div>
                    <button class="btn btn-primary" onclick="openAddModal()">➕ Add New</button>
                </div>

                <div class="alert alert-success" id="successAlert"></div>
                <div class="alert alert-error" id="errorAlert"></div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Icon</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>URL</th>
                                <th>Username</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTable">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 40px;">
                                    <div class="empty-state">
                                        <div class="empty-state-icon">⏳</div>
                                        <h2>Loading applications...</h2>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal" id="addModal" onclick="if(event.target.id === 'addModal') closeAddModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAddModal()">✕</button>
            <div class="modal-title">Add New Application</div>

            <form onsubmit="addApplication(event)">
                <div class="form-grid">
                    <div class="form-group-full">
                        <label>Application Name *</label>
                        <input type="text" id="name" placeholder="e.g., Cognisense" required>
                    </div>

                    <div class="form-group-full">
                        <label>Icon (Emoji) *</label>
                        <input type="text" id="icon" placeholder="e.g., 🧠" maxlength="2" required>
                    </div>

                    <div class="form-group-full">
                        <label>Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Core Systems">Core Systems</option>
                            <option value="CRM">CRM</option>
                            <option value="Communication">Communication</option>
                            <option value="Project Management">Project Management</option>
                            <option value="Development">Development</option>
                            <option value="Analytics & Data">Analytics & Data</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Status *</label>
                        <select id="isActive" required>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Application URL *</label>
                        <input type="url" id="url" placeholder="https://example.com" required>
                    </div>

                    <div class="form-group-full">
                        <label>Username *</label>
                        <input type="text" id="username" placeholder="user@company.com" required>
                    </div>

                    <div class="form-group-full">
                        <label>Password *</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-group-full">
                        <label>Description *</label>
                        <textarea id="description" placeholder="Brief description of the application" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">✅ Add Application</button>
                        <button type="button" class="btn btn-neutral" onclick="closeAddModal()">❌ Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal" onclick="if(event.target.id === 'editModal') closeEditModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeEditModal()">✕</button>
            <div class="modal-title">Edit Application</div>

            <form onsubmit="updateApplication(event)">
                <input type="hidden" id="editId">

                <div class="form-grid">
                    <div class="form-group-full">
                        <label>Application Name *</label>
                        <input type="text" id="editName" required>
                    </div>

                    <div class="form-group-full">
                        <label>Icon (Emoji) *</label>
                        <input type="text" id="editIcon" maxlength="2" required>
                    </div>

                    <div class="form-group-full">
                        <label>Category *</label>
                        <select id="editCategory" required>
                            <option value="Core Systems">Core Systems</option>
                            <option value="CRM">CRM</option>
                            <option value="Communication">Communication</option>
                            <option value="Project Management">Project Management</option>
                            <option value="Development">Development</option>
                            <option value="Analytics & Data">Analytics & Data</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Status *</label>
                        <select id="editIsActive" required>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div class="form-group-full">
                        <label>Application URL *</label>
                        <input type="url" id="editUrl" required>
                    </div>

                    <div class="form-group-full">
                        <label>Username *</label>
                        <input type="text" id="editUsername" required>
                    </div>

                    <div class="form-group-full">
                        <label>Password *</label>
                        <input type="password" id="editPassword" required>
                    </div>

                    <div class="form-group-full">
                        <label>Description *</label>
                        <textarea id="editDescription" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">✅ Save Changes</button>
                        <button type="button" class="btn btn-neutral" onclick="closeEditModal()">❌ Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let applications = [];
        let sessionId = null;

        // ==================== AUTHENTICATION ====================
        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                // Check if response is OK first
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server error:', response.status, errorText);
                    throw new Error(`Server error: ${response.status}`);
                }

                // Check content type before parsing
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('Invalid content type:', contentType, 'Response:', text);
                    throw new Error('Server returned non-JSON response');
                }

                const data = await response.json();

                if (data.success) {
                    sessionId = data.sessionId;
                    localStorage.setItem('sessionId', sessionId);
                    
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dashboardSection').classList.add('visible');
                    loadApplications();
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                } else {
                    loginError.textContent = '❌ ' + (data.error || 'Login failed');
                    loginError.classList.add('show');
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                    setTimeout(() => loginError.classList.remove('show'), 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = '❌ Error: ' + error.message;
                loginError.classList.add('show');
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
            }
        }

        async function handleLogout() {
            if (sessionId) {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId, type: 'admin' })
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            sessionId = null;
            localStorage.removeItem('sessionId');
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('dashboardSection').classList.remove('visible');
            document.getElementById('adminPassword').value = '';
        }

        // ==================== LOAD APPLICATIONS ====================
        async function loadApplications() {
            try {
                const response = await fetch('/data.json');
                if (!response.ok) throw new Error('Failed to load data');
                applications = await response.json();
                renderTable();
            } catch (error) {
                showAlert('error', '❌ Error loading applications: ' + error.message);
            }
        }

        // ==================== RENDER TABLE ====================
        function renderTable() {
            const tbody = document.getElementById('applicationsTable');

            if (applications.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <h2>No applications found</h2>
                                <p style="color: #668899;">Click "Add New" to create your first application</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = applications.map(app => `
                <tr>
                    <td class="icon-cell">${app.icon}</td>
                    <td><strong>${app.name}</strong></td>
                    <td>${app.category}</td>
                    <td><a href="${app.url}" target="_blank" style="color: #64c8ff; text-decoration: none;">Open →</a></td>
                    <td>${app.username}</td>
                    <td><span class="status-badge ${app.isActive ? 'status-active' : 'status-inactive'}">${app.isActive ? '✓ Active' : '✗ Inactive'}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-edit" onclick="openEditModal(${app.id})">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteApplication(${app.id})">🗑️ Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // ==================== ADD APPLICATION ====================
        async function addApplication(event) {
            event.preventDefault();

            const newApp = {
                id: Math.max(...applications.map(a => a.id), 0) + 1,
                name: document.getElementById('name').value,
                icon: document.getElementById('icon').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                url: document.getElementById('url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                isActive: document.getElementById('isActive').value === 'true'
            };

            try {
                const response = await fetch(`/api/applications?sessionId=${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newApp)
                });

                if (!response.ok) throw new Error('Failed to add application');

                applications.push(newApp);
                renderTable();
                event.target.reset();
                closeAddModal();
                showAlert('success', '✅ Application added successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== ADD MODAL ====================
        function openAddModal() {
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
        }

        // ==================== EDIT APPLICATION ====================
        function openEditModal(id) {
            const app = applications.find(a => a.id === id);
            if (!app) return;

            document.getElementById('editId').value = app.id;
            document.getElementById('editName').value = app.name;
            document.getElementById('editIcon').value = app.icon;
            document.getElementById('editCategory').value = app.category;
            document.getElementById('editIsActive').value = app.isActive;
            document.getElementById('editUrl').value = app.url;
            document.getElementById('editUsername').value = app.username;
            document.getElementById('editPassword').value = app.password;
            document.getElementById('editDescription').value = app.description;

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        async function updateApplication(event) {
            event.preventDefault();

            const id = parseInt(document.getElementById('editId').value);
            const updatedApp = {
                id: id,
                name: document.getElementById('editName').value,
                icon: document.getElementById('editIcon').value,
                category: document.getElementById('editCategory').value,
                description: document.getElementById('editDescription').value,
                url: document.getElementById('editUrl').value,
                username: document.getElementById('editUsername').value,
                password: document.getElementById('editPassword').value,
                isActive: document.getElementById('editIsActive').value === 'true'
            };

            try {
                const response = await fetch(`/api/applications/${id}?sessionId=${sessionId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedApp)
                });

                if (!response.ok) throw new Error('Failed to update application');

                const index = applications.findIndex(a => a.id === id);
                if (index !== -1) {
                    applications[index] = updatedApp;
                }
                renderTable();
                closeEditModal();
                showAlert('success', '✅ Application updated successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== DELETE APPLICATION ====================
        async function deleteApplication(id) {
            if (!confirm('Are you sure you want to delete this application?')) return;

            try {
                const response = await fetch(`/api/applications/${id}?sessionId=${sessionId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete application');

                applications = applications.filter(a => a.id !== id);
                renderTable();
                showAlert('success', '✅ Application deleted successfully!');
            } catch (error) {
                showAlert('error', '❌ Error: ' + error.message);
            }
        }

        // ==================== ALERTS ====================
        function showAlert(type, message) {
            const alertEl = document.getElementById(type + 'Alert');
            alertEl.textContent = message;
            alertEl.classList.add('show');

            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 4000);
        }

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', () => {
            const savedSessionId = localStorage.getItem('sessionId');
            if (savedSessionId) {
                sessionId = savedSessionId;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').classList.add('visible');
                loadApplications();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAddModal();
                closeEditModal();
            }
        });
    </script>
</body>
</html>
